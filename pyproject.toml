[tool.ruff]
# Exclude third-party vendored code and auto-generated files
exclude = [
    "rlprompt/",
    ".git",
    "__pycache__",
    "*.egg-info",
    "build",
    "dist",
]
line-length = 120

[tool.ruff.lint]
# E501 line-too-long (handled by line-length above)
# E402 module-level import not at top (common in scripts)
# F401 imported but unused (often intentional re-exports)
# F811 redefinition of unused name (common in test fixtures)
ignore = ["E501", "E402", "F401", "F811"]
select = ["E", "F", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
